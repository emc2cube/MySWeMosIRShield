substitutions:
  device_name: "mys-wemos-ir-shield"
  friendly_name: "MySWeMosIRShield"
  device_area: ""
  board_type: "d1_mini_pro"

# ESPHome Core
esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  area: "${device_area}"

# Hardware options
esp8266:
  board: ${board_type}
  framework:
    version: latest

# Enable ESPHome OTA updates
ota:
  platform: esphome

# Enable logging
logger:
  baud_rate: 0  # 0 Enables logging, but disables serial-port logging to free CPU and memory

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key

# Sync time from Home Assistant
time:
  - platform: homeassistant
    id: homeassistant_time

# WiFi settings
#captive_portal:
wifi:
  id: wifi_component
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Hotspot"

# Create sensors
sensor:
  #Diagnostic
  - platform: wifi_signal
    name: "RSSI"
    update_interval: 1min
    unit_of_measurement: "dBm"
    device_class: "signal_strength"
    state_class: "measurement"
    entity_category: "diagnostic"
  - platform: uptime
    type: timestamp
    name: "Uptime"
    icon: mdi:clock-time-four-outline
    device_class: "timestamp"
    entity_category: "diagnostic"

button:
  #Diagnostic
  - platform: restart
    id: button_restart
    name: "Restart"
    entity_category: "diagnostic"
  - platform: safe_mode
    id: button_safe_mode
    name: "Safe Mode Boot"
    entity_category: "diagnostic"
  - platform: factory_reset
    id: factory_reset_btn
    name: "Factory reset"
    entity_category: "diagnostic"
  # IR Codes - Press on the button to send
  # Fan Woozoo 5-speed globe Fan
  - platform: template
    name: "Woozoo Fan On/Off"
    id: fan_onoff
    icon: mdi:power
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xDE80
          command: 0xFF00
          command_repeats: 1
  # Air Purifier Winix 5300
  - platform: template
    name: "Winix Air Purifier On/Off"
    id: air_purifier_onoff
    icon: mdi:power
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xED12
          command: 0xFC03
          command_repeats: 1
  - platform: template
    name: "Air Purifier Plasmawave"
    id: air_purifier_plasma
    icon: mdi:biohazard
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xED12
          command: 0xFF00
          command_repeats: 1

switch:
  # IR Codes - Toggle to send command and track status (optimistic)
  # Fan
  - platform: template
    name: "Fan On/Off"
    id: fan_switch
    icon: mdi:fan
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - remote_transmitter.transmit_nec:
          address: 0xDE80
          command: 0xFF00
          command_repeats: 1
    turn_off_action:
      - remote_transmitter.transmit_nec:
          address: 0xDE80
          command: 0xFF00
          command_repeats: 1
  # Air Purifier
  - platform: template
    name: "Air Purifier On/Off"
    id: air_purifier_switch
    icon: mdi:air-purifier
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - remote_transmitter.transmit_nec:
          address: 0xED12
          command: 0xFC03
          command_repeats: 1
    turn_off_action:
      - remote_transmitter.transmit_nec:
          address: 0xED12
          command: 0xFC03
          command_repeats: 1

# https://www.esphome.io/components/remote_receiver.html
remote_receiver:
  id: ir_rx
  # TSOP4838 require the use of a pull-up resistor
  pin:
    number: GPIO2
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all

# https://esphome.io/components/remote_transmitter.html#remote-transmitter$0
remote_transmitter:
  id: ir_tx
  pin: GPIO5
  carrier_duty_percent: 50%